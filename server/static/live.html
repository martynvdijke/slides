<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meetup — Live Projector</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="stylesheet" href="/tailwind.css">
<link rel="stylesheet" href="/tokens.css">
<style>
  /* Projector — flat surfaces, no gradients, no blur */
  body{ background: var(--bg); }
  .site-header{ background: var(--bg); border-bottom:1px solid var(--border); }
  /* keep .live-wrap/.live-stage from tailwind, tighten projector rhythm */
  .live-stage{ gap:20px; }
  /* idle / prompt */
  .live-prompt{ color:var(--text); line-height:.96; max-width:18ch; }
  .live-prompt.big{ line-height:.96; }
  /* countdown card — flat */
  #projector-countdown{ background:var(--surface-1); border:1px solid var(--border); }
  /* QR */
  .qr-card{ background:var(--surface-1); border:1px solid var(--border); }
  /* Q&A ranking */
  .qa-rank-item{ display:flex; gap:12px; align-items:flex-start; padding:10px 12px; border:1px solid var(--border); border-radius:10px; background:var(--surface-1); }
  .qa-rank-num{ width:28px; height:28px; border-radius:8px; display:grid; place-items:center; flex-shrink:0; font-weight:700; font-size:.82rem; background:var(--surface-2); border:1px solid var(--border); color:var(--muted); font-variant-numeric:tabular-nums; }
  /* podium — flat */
  .podium-card{ background:var(--surface-1); border:1px solid var(--border); }
  /* confetti — restrained: fewer, slower, flat accent only */
  .confetti i{ width:7px; height:10px; border-radius:2px; opacity:.85; animation:fall 1.35s ease-in forwards; }
  @keyframes fall{0%{transform:translateY(-10px) rotate(0deg); opacity:1}100%{transform:translateY(100vh) rotate(220deg); opacity:0}}
  @media (prefers-reduced-motion:reduce){ .confetti i{ animation:none; opacity:0; } }
  /* mobile */
  @media (max-width: 860px){
    .live-stage{ width:min(100% - 20px,1280px); padding:16px 0; }
    .live-prompt.big{ font-size:clamp(1.9rem,8vw,3.2rem); }
  }
</style>
</head>
<body class="antialiased">
<header class="site-header" role="banner">
  <div class="container flex items-center justify-between h-[58px] gap-3" style="width:min(100% - 32px,1280px)">
    <div class="flex items-center gap-3">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path fill-rule="evenodd" d="M7.5 6.75h9a3 3 0 0 1 3 3v4.5a3 3 0 0 1-3 3h-5.25l-2.625 2.625v-2.625H7.5a3 3 0 0 1-3-3v-4.5a3 3 0 0 1 3-3zM10.125 9.75v4.5L13.875 12z"/></svg></span>
      <h1 id="event-name" class="font-extrabold text-[1rem] leading-none tracking-[-0.03em] m-0">Meetup Live</h1>
      <span class="pill live" id="live-pill">Live</span>
    </div>
    <div class="flex gap-2 items-center flex-wrap justify-end">
      <span class="pill hidden" id="slide-indicator" style="display:none;font-variant-numeric:tabular-nums;font-size:.82rem" aria-live="polite"></span>
      <span class="pill live hidden" id="countdown-pill" aria-live="polite">0:00</span>
      <span class="font-bold text-[0.84rem] leading-none font-mono px-3 py-2 rounded-full border" id="counter" aria-live="polite" style="color:var(--muted);background:var(--surface-1);border-color:var(--border);font-variant-numeric:tabular-nums">— responses</span>
      <span class="pill mono" id="event-code" style="font-family:var(--font-mono);letter-spacing:.04em;text-transform:none">—</span>
    </div>
  </div>
</header>

<main class="live-wrap" role="main">
  <div class="live-stage">
    <section class="glass p-[22px] lg:p-7" aria-live="polite" aria-atomic="true" id="prompt-section">
      <div id="prompt-area"></div>
      <div id="results-area" class="mt-[18px]"></div>
      <div id="cloud-area"></div>
    </section>

    <aside class="grid gap-4" aria-label="Side panel">
      <div class="qr-card">
        <div class="font-bold tracking-[-0.03em]">Join on your phone</div>
        <img id="qr-img" alt="QR code to join this event" src="" class="hidden">
        <div id="qr-placeholder" class="qr-placeholder">QR loading…</div>
        <div class="qr-url" id="qr-url">—</div>
        <div style="color:var(--muted);font-size:.78rem">Scan or visit the link above</div>
      </div>

      <div class="glass card-pad">
        <h2 class="font-bold tracking-[-0.03em] text-[1rem] m-0">Top questions</h2>
        <p class="section-sub">Most up-voted from the audience</p>
        <div id="qa-top" class="grid gap-2 mt-3"></div>
      </div>
    </aside>
  </div>
</main>

<div id="toast-root" aria-live="polite"></div>
<div class="confetti hidden" id="confetti" aria-hidden="true"></div>
<script src="/live.js"></script>
</body>
</html>
