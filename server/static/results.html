<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Results — Live</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="stylesheet" href="/tailwind.css">
<link rel="stylesheet" href="/tokens.css">
<style>
  body{ background:var(--bg); }
  .site-header{ background:var(--bg); border-bottom:1px solid var(--border); }
  /* recap header */
  .recap-head{ padding:20px 0 8px; }
  .recap-title{ font-family:var(--font-display); font-weight:700; letter-spacing:-.03em; font-size:1.55rem; line-height:1.15; margin:0; }
  .recap-meta{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:8px; color:var(--muted); font-size:.82rem; }
  /* sections */
  #results-error{ border:1px solid rgba(239,68,68,.24); background:rgba(239,68,68,.08); color:#fecaca; }
  .section-h{ font-weight:700; letter-spacing:-.02em; font-size:1rem; margin:0 0 2px; }
  .section-desc{ color:var(--muted); font-size:.82rem; margin:0; }
  /* question card specifics */
  .q-card{ background:var(--surface-1); border:1px solid var(--border); border-radius:14px; padding:18px; }
  @media (max-width:430px){
    .container{ width:min(100% - 20px,1120px); }
    .q-card{ padding:16px; }
    footer.container{ padding-bottom:max(24px, env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body class="antialiased">
<header class="site-header" role="banner">
  <div class="container flex items-center justify-between h-[58px] gap-4">
    <a class="brand" href="/" aria-label="Home">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor" class="w-[18px] h-[18px]"><path fill-rule="evenodd" d="M7.5 6.75h9a3 3 0 0 1 3 3v4.5a3 3 0 0 1-3 3h-5.25l-2.625 2.625v-2.625H7.5a3 3 0 0 1-3-3v-4.5a3 3 0 0 1 3-3zM10.125 9.75v4.5L13.875 12z"/></svg></span>
      Meetup
    </a>
    <span class="pill" aria-hidden="true">Results</span>
  </div>
</header>

<main id="main" class="container" role="main">
  <div class="recap-head">
    <h1 class="recap-title" id="results-name">Results</h1>
    <div class="recap-meta" id="results-meta"></div>
  </div>

  <div id="results-error" class="glass card-pad hidden" role="alert"></div>

  <div id="results-content" class="py-3.5 pb-10 grid gap-4 hidden">
    <section class="glass card-pad" id="results-stats" aria-label="Participation"></section>
    <section id="results-questions" class="grid gap-4" aria-label="Question results"></section>
    <section class="glass card-pad" id="results-qa" aria-label="Q&A"></section>
    <section class="glass card-pad" id="results-leaderboard" aria-label="Leaderboard"></section>
  </div>
</main>

<footer class="container" style="padding:18px 0 28px;color:var(--muted);font-size:.78rem">
  <span>Results are published by the host and update as the event unfolds.</span>
</footer>

<script src="/results.js"></script>
</body>
</html>
