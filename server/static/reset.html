<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reset password</title><link rel="stylesheet" href="/tailwind.css"></head>
<body class="antialiased"><div class="max-w-[520px] mx-auto my-[60px] px-4"><div class="glass card-pad">
<h1 class="font-bold text-[1.4rem]">Reset password</h1>
<form id="form-reset" class="mt-4 grid gap-3">
<div class="field"><label for="np">New password</label><input id="np" class="input" type="password" required minlength="8"></div>
<button class="btn btn-primary" type="submit">Set new password</button>
<div id="reset-msg" class="text-[#9AA0B8] text-[0.88rem]"></div>
</form></div></div>
<script src="/reset.js"></script></body></html>
