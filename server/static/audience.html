<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meetup — Live</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="stylesheet" href="/tailwind.css">
</head>
<body class="antialiased">
<header class="site-header" role="banner">
  <div class="container flex items-center justify-between h-[58px] gap-4">
    <a class="brand" href="/" aria-label="Home">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor" class="w-[18px] h-[18px]"><path fill-rule="evenodd" d="M7.5 6.75h9a3 3 0 0 1 3 3v4.5a3 3 0 0 1-3 3h-5.25l-2.625 2.625v-2.625H7.5a3 3 0 0 1-3-3v-4.5a3 3 0 0 1 3-3zM10.125 9.75v4.5L13.875 12z"/></svg></span>
      Meetup
    </a>
    <div style="display:flex;gap:8px;align-items:center">
      <span class="pill hidden" id="slide-indicator" style="display:none;font-variant-numeric:tabular-nums;font-size:.82rem" aria-live="polite"></span>
      <span class="pill live hidden" id="countdown-pill" aria-live="polite">⏱ 0s</span>
      <span class="pill live" aria-live="polite" id="live-badge">Live</span>
    </div>
  </div>
</header>

<main id="main" class="container" role="main">
  <div class="pt-4 pb-2">
    <h1 class="font-extrabold tracking-[-0.03em] text-[1.35rem] leading-[1.15] m-0" id="event-name">Loading…</h1>
    <div class="text-[#9AA0B8] text-[0.84rem] mt-1 flex gap-2 flex-wrap items-center" id="event-meta"><span class="pill" id="event-code">—</span><span id="event-desc"></span></div>
  </div>

  <div class="tabs" role="tablist" aria-label="Event sections">
    <button class="tab" role="tab" aria-selected="true" data-tab="live" id="tab-live">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg> Live
    </button>
    <button class="tab" role="tab" aria-selected="false" data-tab="qa" id="tab-qa">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 01-12 7.7L3 21l1.8-6A8.5 8.5 0 0121 11.5z"/><path d="M8 12h8"/><path d="M8 8h5"/></svg> Q&amp;A
    </button>
    <button class="tab" role="tab" aria-selected="false" data-tab="slides" id="tab-slides">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><path d="M10 13H8"/><path d="M16 17H8"/><path d="M13 13h2"/></svg> Slides
    </button>
    <button class="tab" role="tab" aria-selected="false" data-tab="feedback" id="tab-feedback">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 20l-7 2 2-7a8 8 0 1112 0L12 20z"/><path d="M9 10h6"/><path d="M9 14h4"/></svg> Feedback
    </button>
    <button class="tab" role="tab" aria-selected="false" data-tab="leaderboard" id="tab-leaderboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M8 20V14"/><path d="M12 20V8"/><path d="M16 20v-10"/><path d="M4 20h16"/></svg> Board
    </button>
  </div>
  <!-- identity pill -->
  <div id="identity-bar" class="glass" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:14px;margin-top:12px">
    <div id="identity-avatar" style="width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:18px;flex-shrink:0;background:#6366F1;color:#fff">🙂</div>
    <input id="identity-name" class="input" placeholder="Your name" maxlength="24" style="flex:1;min-width:120px;max-width:190px;height:36px" aria-label="Your display name">
    <div id="identity-emoji-pick" style="display:flex;gap:4px;flex-wrap:wrap"></div>
    <div id="identity-color-pick" style="display:flex;gap:6px;flex-wrap:wrap"></div>
    <button id="identity-save" class="btn btn-ghost btn-small" type="button">Save</button>
  </div>

  <!-- optional recap email opt-in -->
  <div id="recap-card" class="glass" style="padding:12px 14px;border-radius:14px;margin-top:12px">
    <div style="font-weight:700">Get the recap</div>
    <div style="color:var(--muted);font-size:.82rem;margin-top:2px">Optional: we'll email you a summary with the results after the event. You can unsubscribe at any time.</div>
    <form id="recap-form" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
      <input id="recap-email" class="input" type="email" placeholder="you@example.com" maxlength="254" autocomplete="email" style="flex:1;min-width:180px;height:36px" aria-label="Email address for the event recap">
      <button class="btn btn-small" type="submit">Email me the recap</button>
    </form>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px">
      <button id="recap-remove" class="btn btn-ghost btn-small hidden" type="button">Unsubscribe</button>
      <span id="recap-status" style="color:var(--muted);font-size:.78rem" aria-live="polite"></span>
    </div>
  </div>

  <div class="py-3.5 pb-10">
    <section class="grid gap-3.5" role="tabpanel" id="panel-live" aria-labelledby="tab-live">
      <div class="glass card-pad" id="live-card" aria-live="polite"></div>
      <div id="reaction-bar" class="glass" style="display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 12px;border-radius:14px">
        <div style="display:flex;gap:6px;flex-wrap:wrap" id="reaction-btns"></div>
        <div id="reaction-counts" style="display:flex;gap:8px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)"></div>
      </div>
      <div id="quiz-banner" style="display:none" class="glass card-pad"></div>
    </section>

    <section class="grid gap-3.5 hidden" role="tabpanel" id="panel-qa" aria-labelledby="tab-qa">
      <div class="glass card-pad">
        <h2 class="section-title">Ask a question</h2>
        <p class="section-sub">Be kind and concise. The host will approve it.</p>
        <form id="qa-form" class="mt-3.5 grid gap-3">
          <div class="field"><label for="qa-body">Your question</label><textarea id="qa-body" class="textarea" placeholder="What do you want to know?" required maxlength="500" rows="3"></textarea></div>
          <div class="field"><label for="qa-author">Your name (optional)</label><input id="qa-author" class="input" placeholder="Anonymous" maxlength="60"></div>
          <button class="btn btn-primary" type="submit">Submit question</button>
        </form>
      </div>
      <div class="stack" id="qa-list" aria-live="polite"></div>
    </section>

    <section class="grid gap-3.5 hidden" role="tabpanel" id="panel-slides" aria-labelledby="tab-slides">
      <div class="glass card-pad">
        <h2 class="section-title">Slides &amp; resources</h2>
        <p class="section-sub">Download presentations shared by the host.</p>
        <div id="slides-list" class="mt-3.5 grid gap-2.5"></div>
      </div>
    </section>

    <section class="grid gap-3.5 hidden" role="tabpanel" id="panel-feedback" aria-labelledby="tab-feedback">
      <div class="glass card-pad" id="feedback-card"></div>
    </section>

    <section class="grid gap-3.5 hidden" role="tabpanel" id="panel-leaderboard" aria-labelledby="tab-leaderboard">
      <div class="glass card-pad" id="leaderboard-card"></div>
    </section>
  </div>
</main>

<div id="toast-root" aria-live="polite" aria-atomic="true"></div>
<div id="reaction-float" aria-hidden="true" style="position:fixed;left:0;right:0;bottom:90px;pointer-events:none;display:flex;justify-content:center;z-index:40"></div>
<style>
  #identity-bar .color-dot{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .15s, border-color .15s}
  #identity-bar .color-dot.selected{border-color:#fff;transform:scale(1.15);box-shadow:0 0 0 2px rgba(255,255,255,.35)}
  #identity-bar .emoji-dot{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.06);cursor:pointer;display:grid;place-items:center;font-size:16px;transition:transform .12s, background .12s}
  #identity-bar .emoji-dot.selected{background:rgba(124,107,255,.22);border-color:#7C6BFF;transform:scale(1.05)}
  #reaction-bar .r-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.06);font-size:20px;cursor:pointer;display:grid;place-items:center;transition:transform .12s, background .12s}
  #reaction-bar .r-btn:active{transform:scale(.88)}
  #reaction-bar .r-btn.pressed{transform:scale(1.18);background:rgba(124,107,255,.22)}
  #reaction-float .float-emoji{font-size:28px;animation:floatUp 1.1s ease forwards}
  @keyframes floatUp{0%{transform:translateY(8px) scale(.9);opacity:0}15%{opacity:1}100%{transform:translateY(-44px) scale(1.1);opacity:0}}
  #quiz-banner.show{display:block!important;animation:slideIn .22s ease}
  @keyframes slideIn{from{opacity:0;transform:translateY(6px)}}
  .lb-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--border)}
  .lb-rank{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.82rem;background:rgba(124,107,255,.2);color:#C4B5FD;flex-shrink:0}
  .lb-row.is-me{border-color:#7C6BFF;background:rgba(124,107,255,.14)}
  /* --- Global mobile polish: safe area, tap targets --- */
  .site-header{padding-left:max(0px, env(safe-area-inset-left));padding-right:max(0px, env(safe-area-inset-right));padding-top:max(0px, env(safe-area-inset-top));}
  .container{padding-left:max(0px, env(safe-area-inset-left));padding-right:max(0px, env(safe-area-inset-right));}
  .btn{min-height:44px}
  .input, .textarea{font-size:16px} /* prevent iOS zoom */
  /* Tabs: scroll affordance, snap, fade edges */
  .tabs{
    scroll-snap-type:x proximity;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior-x:contain;
    scroll-padding-inline:12px;
    scroll-behavior:smooth;
    position:relative;
    /* fade edges when overflowing */
    -webkit-mask-image:linear-gradient(to right, transparent 0, black 10px, black calc(100% - 10px), transparent 100%);
    mask-image:linear-gradient(to right, transparent 0, black 10px, black calc(100% - 10px), transparent 100%);
  }
  .tab{scroll-snap-align:start;flex-shrink:0;min-height:44px}
  /* When not scrollable, hide mask */
  .tabs:not(.is-scrollable){ -webkit-mask-image:none; mask-image:none; }
  /* Reaction bar comfortable spacing */
  #reaction-bar{gap:10px}
  @media (max-width: 430px){
    .container{width:min(100% - 20px, 1120px)}
    /* Header slightly tighter on phones */
    .site-header .container{height:56px !important}
    #event-name{font-size:1.18rem}
    /* Tabs: tighter padding, smaller type so more fits, clear horizontal scroll */
    .tabs{gap:4px;padding:6px}
    .tab{padding-inline:12px;padding-block:10px;font-size:0.82rem;gap:5px}
    .tab svg{width:14px;height:14px}
    /* Identity bar: larger tap targets, better wrapping at 390px */
    #identity-bar{gap:8px;padding:10px 12px !important;border-radius:14px}
    #identity-avatar{width:38px;height:38px;font-size:19px}
    #identity-name{height:44px !important;min-width:0 !important;max-width:none !important;flex:1 1 140px !important;font-size:16px}
    #identity-bar .emoji-dot{width:40px;height:40px;border-radius:10px;font-size:18px}
    #identity-bar .color-dot{width:34px;height:34px}
    #identity-save{min-height:44px;min-width:56px;justify-content:center}
    #identity-emoji-pick{gap:6px !important;flex:1 1 100%}
    #identity-color-pick{gap:7px !important;flex:1 1 100%}
    /* Recap card: ensure email + button stack cleanly, 44px targets */
    #recap-card{padding:12px !important}
    #recap-email{height:44px !important;min-width:0 !important;flex:1 1 200px !important;font-size:16px}
    #recap-form{gap:8px}
    #recap-form .btn, #recap-remove{min-height:44px}
    #recap-form .btn{flex:1 1 auto;justify-content:center}
    /* Live / QA / slides panels: tighter pad */
    .card-pad{padding:16px}
    .prompt{font-size:1.22rem}
    .waiting{min-height:180px;padding:24px 16px}
    /* Reaction bar: larger buttons, better wrap */
    #reaction-bar{padding:10px !important;justify-content:flex-start}
    #reaction-bar .r-btn{width:48px;height:48px;border-radius:13px;font-size:22px}
    #reaction-btns{gap:8px !important}
    #reaction-counts{width:100%;justify-content:flex-start}
    /* Slides download rows: allow wrap on tiny screens */
    #slides-list > div{flex-wrap:wrap}
    #slides-list .btn{width:100%;justify-content:center;margin-top:4px}
    /* Leaderboard podium: single row stays scrollable if needed */
    .lb-row{padding:10px}
    /* Generic */
    #toast-root{bottom:max(16px, env(safe-area-inset-bottom))}
    #reaction-float{bottom:max(88px, calc(env(safe-area-inset-bottom) + 88px))}
  }
  @media (max-width: 380px){
    .tab{padding-inline:10px;font-size:0.80rem}
    #identity-bar .emoji-dot{width:38px;height:38px}
    #identity-bar .color-dot{width:32px;height:32px}
  }
</style>
<script src="/app.js"></script>
</body>
</html>
